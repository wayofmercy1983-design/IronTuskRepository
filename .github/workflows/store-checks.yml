name: Store checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checkout-and-fulfillment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: python3 restore-store.py --extract-only
      - run: node --test restored-store/tests/*.test.mjs
